name: brikstax
description: BrikStax — LEGO Collection Tracker with eBay price tracking
publish_to: none
version: 2.3.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  image: ^4.2.0
  path_provider: ^2.1.4
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  # State
  provider: ^6.1.1
  # Storage
  sqflite: ^2.3.0
  path: ^1.9.0
  # Network
  http: ^1.2.0
  # community_service.dart uses MediaType from this directly (multipart
  # photo submission uploads) -- was only resolving as a transitive dep of
  # some other package, which the analyzer flags as fragile: if that other
  # package ever drops its own dependency on http_parser, this import
  # breaks with no warning until it happens. Declared explicitly instead.
  http_parser: ^4.1.2
  # Scanner
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  # Charts
  fl_chart: ^0.67.0
  # Fonts
  google_fonts: ^6.1.0
  # UI / Animation
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  # Utils
  uuid: ^4.3.3
  share_plus: ^12.0.2
  url_launcher: ^6.3.0

  home_widget: ^0.6.0
  image_cropper: ^8.0.2
  # Renders the "Scan to view in BrikStax" QR code on the Set share card's
  # Product Photo style -- encodes a brikstax://set/<num> deep link
  # (deep_link_service.dart already handles this scheme).
  qr_flutter: ^4.1.0
  sentry_flutter: ^9.25.0
  package_info_plus: ^9.0.1
  app_links: ^7.2.1

  # Push notifications (Firebase Cloud Messaging). Dev-gated for now (see
  # push_service.dart) -- Android only until an iOS Firebase app + APNs key
  # exist. firebase_core must come before firebase_messaging in every
  # Firebase.initializeApp() call site, same requirement as any other
  # Firebase package.
  # Was pinned to the last major line before FlutterFire's web plugins moved
  # to package:web ^1.0.0, since share_plus 9.0.0 (then a dependency here)
  # pinned web ^0.5.0 -- share_plus is now ^12.0.2 (needs web ^1.0.0 itself),
  # so that conflict no longer applies and these can track current.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Local (on-device) scheduled notifications -- the Daily Five reminder
  # (services/local_notification_service.dart) and any future "reminder
  # about MY OWN state" notification. Deliberately separate from the FCM
  # push stack above: whether you've done today's Daily Five is local-only
  # state (SQLite, per device, never synced), so a server can't know to
  # push about it -- this schedules/cancels entirely on-device instead.
  # timezone/flutter_timezone are here only to support
  # flutter_local_notifications' zonedSchedule API (needs to know the
  # device's real IANA timezone, not just a UTC offset, so a scheduled
  # "7pm local" reminder is actually 7pm local across DST changes).
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

flutter_native_splash:
  color: "#0A0907"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#0A0907"
    image: assets/splash/splash_logo.png
  android: true
  ios: true



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  assets:
    - assets/avatar/hats/
    - assets/avatar/heads/
    - assets/avatar/outfits/
    - assets/avatar/items/
    - assets/avatar/dens/
    - assets/avatar_pixel/heads/
    - assets/avatar_pixel/hats/
    - assets/avatar_pixel/torsos/
    - assets/avatar_pixel/legs/
    - assets/avatar_pixel/items/
    - assets/den_hud/
    - assets/brand/

  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
