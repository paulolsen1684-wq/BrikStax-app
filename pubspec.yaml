name: brikstax
description: BrikStax — LEGO Collection Tracker with eBay price tracking
publish_to: none
version: 2.1.6+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  image: ^4.2.0
  path_provider: ^2.1.4
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  # State
  provider: ^6.1.1
  # Storage
  sqflite: ^2.3.0
  path: ^1.9.0
  # Network
  http: ^1.2.0
  # Scanner
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  # Charts
  fl_chart: ^0.67.0
  # Fonts
  google_fonts: ^6.1.0
  # UI / Animation
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  # Utils
  uuid: ^4.3.3
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

  home_widget: ^0.6.0
  image_cropper: ^8.0.2
  sentry_flutter: ^8.14.2
  package_info_plus: ^9.0.1

flutter_native_splash:
  color: "#0A0907"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#0A0907"
    image: assets/splash/splash_logo.png
  android: true
  ios: true



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  assets:
    - assets/avatar/hats/
    - assets/avatar/heads/
    - assets/avatar/outfits/
    - assets/avatar/items/
    - assets/avatar/dens/
    - assets/avatar_pixel/heads/
    - assets/avatar_pixel/hats/
    - assets/avatar_pixel/torsos/
    - assets/avatar_pixel/legs/
    - assets/avatar_pixel/items/
    - assets/den_hud/

  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"