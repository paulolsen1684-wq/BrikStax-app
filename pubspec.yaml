name: brikstax
description: BrikStax — LEGO Collection Tracker with eBay price tracking
publish_to: none
version: 2.2.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  image: ^4.2.0
  path_provider: ^2.1.4
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  # State
  provider: ^6.1.1
  # Storage
  sqflite: ^2.3.0
  path: ^1.9.0
  # Network
  http: ^1.2.0
  # community_service.dart uses MediaType from this directly (multipart
  # photo submission uploads) -- was only resolving as a transitive dep of
  # some other package, which the analyzer flags as fragile: if that other
  # package ever drops its own dependency on http_parser, this import
  # breaks with no warning until it happens. Declared explicitly instead.
  http_parser: ^4.1.2
  # Scanner
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  # Charts
  fl_chart: ^0.67.0
  # Fonts
  google_fonts: ^6.1.0
  # UI / Animation
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  # Utils
  uuid: ^4.3.3
  share_plus: ^12.0.2
  url_launcher: ^6.3.0

  home_widget: ^0.6.0
  image_cropper: ^8.0.2
  sentry_flutter: ^9.25.0
  package_info_plus: ^9.0.1
  app_links: ^7.2.1

  # Push notifications (Firebase Cloud Messaging). Dev-gated for now (see
  # push_service.dart) -- Android only until an iOS Firebase app + APNs key
  # exist. firebase_core must come before firebase_messaging in every
  # Firebase.initializeApp() call site, same requirement as any other
  # Firebase package.
  # Pinned to the last major line before FlutterFire's web plugins moved to
  # package:web ^1.0.0 -- share_plus 9.0.0 (already a dependency here) pins
  # web ^0.5.0, same conflict CLAUDE.md documents for the sentry_flutter 9.x
  # upgrade path being blocked for the same reason. Bump both together if
  # share_plus is ever majored up past this.
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4

flutter_native_splash:
  color: "#0A0907"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#0A0907"
    image: assets/splash/splash_logo.png
  android: true
  ios: true



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  assets:
    - assets/avatar/hats/
    - assets/avatar/heads/
    - assets/avatar/outfits/
    - assets/avatar/items/
    - assets/avatar/dens/
    - assets/avatar_pixel/heads/
    - assets/avatar_pixel/hats/
    - assets/avatar_pixel/torsos/
    - assets/avatar_pixel/legs/
    - assets/avatar_pixel/items/
    - assets/den_hud/

  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
